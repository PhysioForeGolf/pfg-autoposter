name: Weekly token health check

on:
  schedule:
    - cron: "0 12 * * 0"   # Sundays ~8am Eastern
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
        run: python publisher/check_token.py
